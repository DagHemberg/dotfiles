general {
    fail_timeout = 1000

    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.02
    contrast = 1.05
    brightness = 0.72
    vibrancy = 0.18
    vibrancy_darkness = 0.2
}

input-field {
    monitor =
    size = 310, 60
    position = 0, -230

    outline_thickness = 0
    dots_size = 0.26 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding

    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(0, 0, 0, 0) # no background
    font_color = rgb(255, 255, 255)

    # State Colors
    # check_color = rgba(139, 233, 253, 0.2)   # Cyan glow on check
    check_color = rgba(255, 85, 85, 0.3)   # Cyan glow on check
    fail_color = rgba(0, 0, 0, 0)      # Coral red on failure
    capslock_color = rgba(139, 233, 253, 0.2)

    fade_on_empty = true
    fade_timeout = 0 # Milliseconds before fade_on_empty is triggered
    # placeholder_text = <span foreground="##a6adc8"> </span>
    fail_text = <span></span>
    placeholder_text = <span></span>

    # Styling & Positioning
    hide_input = false
    rounding = 20 # Soft rounded edges

}

input-field {
    monitor = 
    size = 310, 60
    position = 0, -310

    font_color = rgba(0, 0, 0, 0)
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
    check_color = rgba(0, 0, 0, 0)
    fail_color = rgba(0, 0, 0, 0)

    fail_text = <span foreground="##ff5555"><b>$FAIL</b> ($ATTEMPTS)</span>
    placeholder_text=<span></span>
}

label {
    monitor = 
    text = $TIME
    font_size = 150
    position = 0, 20
    font_family = Helvetica Rounded
}

label {
    monitor = 
    font_family = Helvetica Rounded
    font_size = 25
    position = 0, -120
    text = cmd[update:60000] date +'%A, %d %B' | sed 's/^./\U&/'
}

